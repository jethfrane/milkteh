<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MILKTEH - Digital Menu</title>
    <!-- Load Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Poppins:wght@500;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#fdf8f6',
                            100: '#f2e8e5',
                            500: '#d97757', // warm milk tea orange/brown
                            600: '#c25c3d',
                            900: '#4a2511', // dark boba brown
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom styles for smooth scrolling and hiding scrollbars for categories */
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .menu-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .menu-card:active {
            transform: scale(0.98);
        }
        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased font-sans flex flex-col min-h-screen">

    <header class="bg-brand-900 text-white pt-8 pb-10 px-4 rounded-b-3xl shadow-lg relative overflow-hidden">
        <!-- Decorative background circles -->
        <div class="absolute top-0 left-0 w-32 h-32 bg-white opacity-5 rounded-full -translate-x-1/2 -translate-y-1/2"></div>
        <div class="absolute bottom-0 right-0 w-40 h-40 bg-brand-500 opacity-20 rounded-full translate-x-1/3 translate-y-1/3"></div>
        
        <div class="max-w-4xl mx-auto relative z-10 text-center">
            <h1 class="text-4xl md:text-5xl font-display font-extrabold tracking-tight mb-2">MILKTEH</h1>
            <p class="text-brand-100 text-sm md:text-base font-medium opacity-90">Premium Boba • Coffee • Snacks</p>
            
            <div class="mt-6 flex justify-center gap-4 text-xs font-semibold text-brand-900">
                <span class="bg-white px-3 py-1 rounded-full shadow-sm flex items-center gap-1">
                    <i class="fa-solid fa-wifi text-brand-500"></i> Free WiFi
                </span>
                <span class="bg-white px-3 py-1 rounded-full shadow-sm flex items-center gap-1">
                    <i class="fa-solid fa-leaf text-brand-500"></i> 100% Fresh
                </span>
            </div>
        </div>
    </header>

    <nav class="max-w-4xl mx-auto w-full px-4 -mt-4 relative z-20">
        <div class="bg-white rounded-2xl shadow-md p-2 flex overflow-x-auto hide-scrollbar gap-2" id="category-container">
            <!-- Categories will be injected here via JS -->
        </div>
    </nav>

    <main class="flex-grow max-w-4xl mx-auto w-full px-4 py-8">
        <div class="flex justify-between items-end mb-6">
            <h2 class="text-2xl font-display font-bold text-gray-800" id="section-title">All Menu</h2>
            <p class="text-sm text-gray-500 font-medium" id="item-count">0 items</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="menu-grid">
            <!-- Menu items will be injected here via JS -->
        </div>
        
        <!-- Empty State (Hidden by default) -->
        <div id="empty-state" class="hidden text-center py-12">
            <i class="fa-solid fa-mug-hot text-4xl text-gray-300 mb-4"></i>
            <h3 class="text-lg font-medium text-gray-600">No items found in this category.</h3>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-200 py-8 mt-auto">
        <div class="max-w-4xl mx-auto px-4 text-center">
            <h3 class="font-display font-bold text-gray-800 text-lg mb-2">MILKTEH</h3>
            <p class="text-sm text-gray-500 mb-4">Visit us every day from 10:00 AM to 10:00 PM.</p>
            <div class="flex justify-center gap-4 mb-6">
                <a href="#" class="w-10 h-10 rounded-full bg-brand-50 text-brand-600 flex items-center justify-center text-xl hover:bg-brand-500 hover:text-white transition-colors">
                    <i class="fa-brands fa-facebook-f"></i>
                </a>
                <a href="#" class="w-10 h-10 rounded-full bg-brand-50 text-brand-600 flex items-center justify-center text-xl hover:bg-brand-500 hover:text-white transition-colors">
                    <i class="fa-brands fa-instagram"></i>
                </a>
            </div>
            <p class="text-xs text-gray-400">&copy; <span id="year"></span> MILKTEH. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // Set current year in footer
        document.getElementById('year').textContent = new Date().getFullYear();

        // Menu Data (Easily editable by your friend)
        const categories = [
            { id: 'all', name: 'All Menu', icon: 'fa-star' },
            { id: 'milktea', name: 'Milk Tea', icon: 'fa-glass-water' },
            { id: 'coffee', name: 'Coffee', icon: 'fa-mug-hot' },
            { id: 'drinks', name: 'Other Drinks', icon: 'fa-martini-glass-citrus' },
            { id: 'snacks', name: 'Snacks & Fries', icon: 'fa-utensils' }
        ];

        // Placeholder image format: https://placehold.co/400x300/{bgcolor}/{textcolor}?text={text}
        const menuItems = [
            // MILK TEA
            { id: 1, name: "Classic Pearl Milk Tea", category: "milktea", price: 95, desc: "Our signature black tea with creamy milk and chewy tapioca pearls.", img: "https://placehold.co/400x300/d97757/ffffff?text=Classic+Pearl" },
            { id: 2, name: "Okinawa Brown Sugar", category: "milktea", price: 110, desc: "Roasted brown sugar syrup blended with premium milk tea.", img: "https://placehold.co/400x300/4a2511/ffffff?text=Okinawa" },
            { id: 3, name: "Taro Fantasy", category: "milktea", price: 105, desc: "Sweet, creamy taro root milk tea. A crowd favorite!", img: "https://placehold.co/400x300/9333ea/ffffff?text=Taro+Fantasy" },
            { id: 4, name: "Wintermelon Bliss", category: "milktea", price: 100, desc: "Refreshing wintermelon flavor perfect for hot days.", img: "https://placehold.co/400x300/fcd34d/4a2511?text=Wintermelon" },
            
            // COFFEE
            { id: 5, name: "Iced Spanish Latte", category: "coffee", price: 130, desc: "Espresso with sweet condensed milk over ice.", img: "https://placehold.co/400x300/78350f/ffffff?text=Spanish+Latte" },
            { id: 6, name: "Caramel Macchiato", category: "coffee", price: 140, desc: "Vanilla-flavored drink marked with espresso and caramel drizzle.", img: "https://placehold.co/400x300/b45309/ffffff?text=Caramel+Macc" },
            { id: 7, name: "Iced Americano", category: "coffee", price: 100, desc: "Simple, strong, and refreshing black coffee.", img: "https://placehold.co/400x300/1c1917/ffffff?text=Americano" },
            
            // DRINKS
            { id: 8, name: "Passionfruit Green Tea", category: "drinks", price: 105, desc: "Fresh green tea infused with real passionfruit.", img: "https://placehold.co/400x300/fbbf24/4a2511?text=Passionfruit" },
            { id: 9, name: "Strawberry Soda", category: "drinks", price: 95, desc: "Fizzy sparkling water with sweet strawberry puree.", img: "https://placehold.co/400x300/ef4444/ffffff?text=Strawberry+Soda" },
            
            // SNACKS
            { id: 10, name: "BBQ Flavored Fries", category: "snacks", price: 85, desc: "Crispy fries coated in savory and sweet BBQ powder.", img: "https://placehold.co/400x300/f59e0b/ffffff?text=BBQ+Fries" },
            { id: 11, name: "Cheesy Nachos", category: "snacks", price: 120, desc: "Tortilla chips loaded with melted cheese sauce and jalapenos.", img: "https://placehold.co/400x300/fef08a/4a2511?text=Nachos" },
            { id: 12, name: "Chicken Pops", category: "snacks", price: 150, desc: "Bite-sized fried chicken chunks, perfectly seasoned.", img: "https://placehold.co/400x300/d97757/ffffff?text=Chicken+Pops" },
        ];

        let currentCategory = 'all';

        function renderCategories() {
            const container = document.getElementById('category-container');
            container.innerHTML = '';

            categories.forEach(cat => {
                const isActive = cat.id === currentCategory;
                const btn = document.createElement('button');
                btn.className = `flex-shrink-0 flex items-center gap-2 px-5 py-2.5 rounded-xl font-medium text-sm transition-colors whitespace-nowrap ${
                    isActive 
                    ? 'bg-brand-900 text-white shadow-md' 
                    : 'bg-transparent text-gray-600 hover:bg-gray-100'
                }`;
                btn.onclick = () => filterMenu(cat.id, cat.name);
                btn.innerHTML = `<i class="fa-solid ${cat.icon}"></i> ${cat.name}`;
                container.appendChild(btn);
            });
        }

        function formatPrice(price) {
            return `₱${price.toFixed(2)}`;
        }

        function renderMenu(items) {
            const grid = document.getElementById('menu-grid');
            const emptyState = document.getElementById('empty-state');
            const itemCount = document.getElementById('item-count');
            
            grid.innerHTML = '';
            itemCount.textContent = `${items.length} item${items.length !== 1 ? 's' : ''}`;

            if (items.length === 0) {
                grid.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            grid.classList.remove('hidden');
            emptyState.classList.add('hidden');

            items.forEach((item, index) => {
                // Add staggered animation delay
                const delay = index * 50; 
                
                const card = document.createElement('div');
                card.className = 'menu-card bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col fade-in';
                card.style.animationDelay = `${delay}ms`;
                card.style.animationFillMode = 'both';

                card.innerHTML = `
                    <div class="relative h-48 w-full bg-gray-200">
                        <!-- Using image with a fallback error handler -->
                        <img src="${item.img}" alt="${item.name}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/400x300/e5e7eb/a3a3a3?text=No+Image'">
                        <div class="absolute top-3 right-3 bg-white/90 backdrop-blur-sm px-3 py-1 rounded-full text-brand-900 font-bold shadow-sm">
                            ${formatPrice(item.price)}
                        </div>
                    </div>
                    <div class="p-4 flex flex-col flex-grow">
                        <h3 class="text-lg font-bold font-display text-gray-800 mb-1 leading-tight">${item.name}</h3>
                        <p class="text-sm text-gray-500 mb-4 flex-grow">${item.desc}</p>
                        <button class="w-full bg-brand-50 hover:bg-brand-100 text-brand-600 font-semibold py-2 rounded-xl text-sm transition-colors mt-auto">
                            View Details
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterMenu(categoryId, categoryName) {
            currentCategory = categoryId;
            
            // Update UI Title
            document.getElementById('section-title').textContent = categoryName;
            
            // Update active category button styling
            renderCategories();

            // Filter data
            let filteredItems = menuItems;
            if (categoryId !== 'all') {
                filteredItems = menuItems.filter(item => item.category === categoryId);
            }

            // Render filtered items
            renderMenu(filteredItems);
        }

        // Initialize App on Load
        window.addEventListener('DOMContentLoaded', () => {
            renderCategories();
            renderMenu(menuItems);
        });
    </script>
</body>
</html>
